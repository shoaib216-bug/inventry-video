
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AudaX</title>

  <style>

    .video {
  width: 100%;
  max-width: 1100px;
  aspect-ratio: 16 / 9;

  border-radius: 16px;
  overflow: hidden;

  background: #000;

  box-shadow:
    0 25px 60px rgba(37, 99, 235, 0.22);
}

.video iframe {
  width: 100%;
  height: 100%;

  border: 0;
  display: block;
}

 body {
  min-height: 100vh;

  background:
    radial-gradient(
      circle at 50% 0%,
      #6EA8FE 0%,
      #A9CCFF 30%,
      #D9E8FF 65%,
      #F7FAFF 100%
    );

  font-family: Arial, sans-serif;
}

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: #f5f7fb;

      font-family: Arial, sans-serif;
    }

    /* Team Name */

    h1 {
      font-size: clamp(4rem, 10vw, 8rem);

      font-weight: 900;

      letter-spacing: -6px;

      color: #111827;

      margin-bottom: 35px;
    }

    h1 span {
      color: #2563eb;
    }

    /* Video */

    video {
      width: 100%;
      max-width: 1100px;

      display: block;

      border-radius: 16px;

      background: #000;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.15);
    }

    /* Mobile */

    @media (max-width: 600px) {

      body {
        padding: 20px;
      }

      h1 {
        margin-bottom: 25px;
      }

    }

  </style>

</head>


<body>

  <h1>
    Auda<span>X</span>
  </h1>


  <div class="video">

  <iframe
    src="https://www.youtube.com/embed/627VltVwTL8"
    title="AudaX Team Video"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>

</div>

</body>

</html>
